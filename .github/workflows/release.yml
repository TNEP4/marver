# Trusted publishing (OIDC): activates once the repo is public and this workflow is
# registered as the trusted publisher for @marver-design/marver on npmjs.com.
# Release = npm version <patch|minor> && git push --follow-tags
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm publish
