<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="glass.css">
<link rel="stylesheet" href="menu.css">
<link rel="stylesheet" href="style.css">
<script src="main.js" defer></script>
</head>
<body class="hm st">
<main class="st-body">
  <div class="st-col">
    <header class="st-head">
      <h1>Settings</h1>
      <p>Saved as plain files in <code class="dir">~/.marver/</code> - your agents read the same ones.</p>
      <p class="st-note" id="note" hidden></p>
    </header>
    <div class="st-bads" id="bad"></div>
    <div class="st-groups" id="groups"></div>
    <footer class="st-foot">
      <span><code>config.json</code> and <code>theme.json</code> in <code class="dir">~/.marver/</code></span>
      <button type="button" class="st-btn ghost" id="reveal">Show the files</button>
    </footer>
  </div>
</main>
<div class="sr-only" id="live" aria-live="polite"></div>
</body>
</html>
