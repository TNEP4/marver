<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="style.css">
<script src="main.js" defer></script>
</head>
<body class="ground">
<main class="settings">
  <div class="col">
    <h1 class="h1">Settings</h1>
    <p class="hint warn" id="note" hidden></p>
    <div id="files"></div>
    <div class="foot"><button type="button" class="quiet" id="reveal">Show the Files</button></div>
  </div>
  <aside class="side" id="side" aria-label="Files that did not apply"></aside>
</main>
<div class="sr-only" id="live" aria-live="polite"></div>
</body>
</html>
